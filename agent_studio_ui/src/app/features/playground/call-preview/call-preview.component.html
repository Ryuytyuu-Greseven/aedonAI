<div class="cp">
  <div class="cp-intro">
    <span class="cp-intro-icon"><i class="fa-solid fa-phone-volume" aria-hidden="true"></i></span>
    <p class="text-muted">The agent calls the number you enter. Answer your phone to talk to it.</p>
  </div>

  <div [formGroup]="phoneForm" class="cp-dial">
    <div class="cp-phone" [class.cp-phone-invalid]="phoneForm.controls.number.invalid && phoneForm.controls.number.touched">
      <select class="select" formControlName="countryCode" aria-label="Customer country code">
        @for (country of countryCodes; track country.value) {
          <option [value]="country.value">{{ country.label }}</option>
        }
      </select>
      <input type="tel" class="input input-mono" formControlName="number" placeholder="Mobile number" aria-label="Customer mobile number" inputmode="tel" />
    </div>
    <button
      type="button"
      class="btn btn-primary cp-call"
      [class.cp-call-live]="callStatus() === 'calling'"
      [disabled]="callStatus() === 'calling'"
      (click)="startPreviewCall()"
    >
      @if (callStatus() === 'calling') {
        <span class="cp-ring"></span> Calling…
      } @else {
        <i class="fa-solid fa-phone" aria-hidden="true"></i> {{ callStatus() === 'placed' ? 'Call again' : 'Call me' }}
      }
    </button>
  </div>
  @if (phoneForm.controls.number.invalid && phoneForm.controls.number.touched) {
    <p class="field-error">Enter a valid mobile number (6–12 digits).</p>
  }

  @if (callStatus() === 'placed') {
    <div class="cp-result cp-result-ok">
      <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
      Call placed — your phone should ring shortly.
    </div>
  }
</div>
