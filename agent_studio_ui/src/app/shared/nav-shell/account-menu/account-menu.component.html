<div class="avatar-wrapper" [class.avatar-expanded]="expanded()">
  <button type="button" class="avatar-trigger" (click)="toggle()" [attr.aria-expanded]="expanded()" aria-label="Account menu">
    <span class="avatar-circle">{{ initial() }}</span>
    <span class="avatar-trigger-name">{{ name() || email() }}</span>
    <i class="fa-solid fa-chevron-down avatar-caret" aria-hidden="true"></i>
  </button>

  <div class="avatar-panel" role="menu">
    <div class="avatar-panel-head">
      <span class="avatar-circle avatar-circle-lg">{{ initial() }}</span>
      <div class="avatar-panel-identity">
        <strong>{{ name() || 'Your account' }}</strong>
        <span class="avatar-email">{{ email() }}</span>
        <span class="avatar-role" [class.avatar-role-admin]="isAdmin()">
          <i class="fa-solid" [class.fa-crown]="isAdmin()" [class.fa-headset]="!isAdmin()" aria-hidden="true"></i>
          {{ roleLabel() }}
        </span>
      </div>
    </div>

    <div class="avatar-menu">
      <a routerLink="/profile" class="avatar-menu-item" role="menuitem" style="--i: 0">
        <i class="fa-solid fa-id-badge" aria-hidden="true"></i>
        <span>Profile &amp; company</span>
      </a>
      @if (isAdmin()) {
        <a routerLink="/admin-settings" class="avatar-menu-item" role="menuitem" style="--i: 1">
          <i class="fa-solid fa-gear" aria-hidden="true"></i>
          <span>Admin settings</span>
        </a>
      }
      <button type="button" class="avatar-menu-item" role="menuitem" (click)="themeService.toggle()" style="--i: 2">
        <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
        <span>Appearance</span>
        <span class="avatar-menu-hint">{{ themeService.theme() === 'dark' ? 'Dark' : 'Light' }}</span>
      </button>
    </div>

    <button type="button" class="avatar-menu-item avatar-logout" role="menuitem" (click)="logout()" style="--i: 3">
      <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
      <span>Log out</span>
    </button>
  </div>
</div>
