<div class="modal-backdrop" (click)="close()" role="presentation">
  <div
    class="modal-panel"
    [style.max-width.px]="width()"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
  >
    <header class="modal-head">
      @if (icon(); as icon) {
        <span class="modal-icon" [attr.data-tone]="tone()"><i class="fa-solid {{ icon }}" aria-hidden="true"></i></span>
      }
      <div class="modal-titles">
        <h2 [id]="titleId">{{ title() }}</h2>
        @if (subtitle()) {
          <p>{{ subtitle() }}</p>
        }
      </div>
      <button type="button" class="modal-close" (click)="close()" aria-label="Close dialog">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="modal-body">
      <ng-content />
    </div>

    <footer class="modal-foot">
      <ng-content select="[modal-footer]" />
    </footer>
  </div>
</div>
